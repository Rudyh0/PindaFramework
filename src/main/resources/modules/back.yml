# ┌──────────────────────────────────────────────┐
# │            PindaFramework - back             │
# └──────────────────────────────────────────────┘
# /back brengt je terug naar je plek van vóór je laatste teleport.
# Wachttijd, cooldown en kosten staan in teleport.yml.

# Ook terug kunnen naar de plek waar je doodging.
# Per rank te regelen met de permissie pinda.back.death (staat standaard aan voor iedereen).
on-death: true

# Na het respawnen een klikbaar berichtje tonen om terug te gaan
death-hint: true

# Ligt je rugtas nog waar je doodging (zie backpack.yml) en ga je er met /back heen, dan
# verdwijnt je rugtas met alles erin. Eerst krijg je een waarschuwing; met /back bevestig (of
# nog een keer /back) ga je toch. Zo moet je er zelf heen lopen om je spullen terug te halen.
# false = /back laat de rugtas gewoon liggen.
death-loses-backpack: true
