# ┌──────────────────────────────────────────────┐
# │            PindaFramework - skills           │
# └──────────────────────────────────────────────┘
# Skills zoals in RuneScape: level 0 tot 99, elk level is ongeveer 10% duurder dan het vorige.
# Bij elke level-up krijg je contant geld. Spelers zien hun voortgang met /skills.
# XP-waarden mogen decimalen hebben (bijv. 0.5). Een blok, mob of item dat niet in de lijst
# staat, geeft geen XP (behalve waar een 'default' staat).

# Het hoogste level
max-level: 99

curve:
  # Hoeveel XP de levels kosten. 1.0 = precies RuneScape (level 99 = ruim 14 miljoen XP).
  # 0.1 = tien keer zo snel (level 50 = ca. 11.000 XP, level 99 = ca. 1,4 miljoen XP).
  multiplier: 0.1

# Vaste vermenigvuldiger voor alle XP (een tijdelijke XP-boost zet je met /skills boost).
xp-multiplier: 1.0

reward:
  # Contant geld bij elke level-up: basis + (level x per-level)
  enabled: true
  base: 10
  per-level: 5
  # Extra bonus bij deze levels, bovenop het gewone bedrag
  milestones:
    "50": 1000
    "75": 2500
    "99": 10000

# Bij deze levels ziet de hele server het in de chat
announce-levels: [50, 75, 99]

notifications:
  # Staat de XP-melding in de actionbar standaard aan? Spelers kunnen dit zelf wijzigen in /instellingen.
  default-enabled: true
  # Ook tonen in het setupmenu bij de eerste keer joinen
  show-in-setup: false
  # XP die binnen zoveel seconden binnenkomt, wordt opgeteld in één melding
  combo-seconds: 3

# Werelden waarin je geen XP krijgt
disabled-worlds: []

# Krijg je XP in creative?
creative-gives-xp: false

# Blokken die spelers zelf neergezet hebben, geven geen XP (anders kun je eindeloos hetzelfde blok plaatsen en breken).
placed-blocks-give-xp: false
# Steen en cobblestone uit een generator (lava + water) tellen ook als neergezet
generated-blocks-give-xp: false

# Mobs uit een spawner of spawn-ei geven minder XP (0.25 = een kwart)
spawner-mob-multiplier: 0.25
reduced-spawn-reasons: [SPAWNER, SPAWNER_EGG, DISPENSE_EGG]

