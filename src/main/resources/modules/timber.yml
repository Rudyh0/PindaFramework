# ┌──────────────────────────────────────────────┐
# │          PindaFramework - bomen kappen       │
# └──────────────────────────────────────────────┘
# Hak met een bijl het onderste blok van een boom om en de hele boom valt om, weg van je.
# Er wordt meteen een nieuwe sapling geplant. Geen extra loot: alleen wat de blokken in
# Minecraft zelf opleveren. Zelf gebouwde dingen van hout vallen nooit om: daarvoor zijn
# natuurlijke bladeren nodig, en zelf geplaatste blokken tellen niet mee.

# Wanneer werkt het? always = altijd, sneaking = alleen gebukt, not-sneaking = alleen als je niet bukt
only-while: always

# Staat het standaard aan? Spelers zetten het zelf aan of uit in /instellingen of met /timber.
default-enabled: true

# De schakelaar ook tonen in het setupmenu bij de eerste keer joinen
show-in-setup: false

# Ook in creative?
creative: false

# Seconden wachten tussen twee bomen (0 = geen wachttijd)
cooldown-seconds: 1

# Werelden waar bomen niet in één keer omgaan
disabled-worlds: []

detection:
  # Bomen met meer blokken hout dan dit gaan niet om (dan is het waarschijnlijk een bouwwerk)
  max-logs: 250
  # Minimaal zoveel natuurlijke bladeren, anders is het geen boom
  min-leaves: 5
  # Maximaal zoveel bladeren per boom (de rest blijft hangen en vergaat vanzelf)
  max-leaves: 1000
  # Alleen het hout vanaf het gehakte blok en hoger. Hak je halverwege, dan blijft de stronk staan.
  only-upwards: true
  # De bladeren gaan ook weg
  leaves: true
  # Alleen als de stam op natuurlijke grond staat (aarde, gras, modder, ...). Zo gaan oude
  # bouwwerken van hout op een fundering nooit om, ook niet als ze van vóór de plugin zijn.
  require-ground: true

tool:
  # Alleen met een bijl
  axe-only: true
  # De bijl slijt per blok hout (unbreaking telt mee, net als in Minecraft)
  realistic-damage: true
  # Gaat je bijl daardoor kapot? Dan valt de boom niet om (je hakt dan gewoon één blok).
  protect: true

replant:
  # Meteen een nieuwe sapling planten waar de boom stond (bij 2x2-bomen vier stuks)
  enabled: true
  # Zo lang (seconden) kun je de nieuwe sapling niet per ongeluk kapot slaan
  protect-seconds: 3
  # Op welke grond een sapling geplant wordt
  soil:
    - GRASS_BLOCK
    - DIRT
    - COARSE_DIRT
    - PODZOL
    - ROOTED_DIRT
    - MOSS_BLOCK
    - PALE_MOSS_BLOCK
    - MUD
    - MUDDY_MANGROVE_ROOTS

drops:
  # landing = waar de boom neervalt, base = bij de stam, inventory = meteen in je inventory
  # (wat niet past, valt bij je op de grond)
  mode: landing
  # Bladeren laten vallen wat ze in Minecraft ook laten vallen (saplings, stokjes, appels)
  leaves: true

animation:
  # fall = de boom valt echt om, none = de boom verdwijnt meteen
  type: fall
  # Hoe lang het vallen duurt (ticks, 20 = 1 seconde)
  duration-ticks: 30
  # Hoe lang de gevallen boom blijft liggen voordat hij verdwijnt (ticks)
  linger-ticks: 20
  # Meer blokken dan dit laten we niet vallen (de rest verdwijnt meteen), voor de prestaties
  max-blocks: 400
  # Schade aan spelers en mobs waar de boom op valt (in halve hartjes, 0 = geen)
  damage: 2
  # Geluiden (namen: https://minecraft.wiki/w/Sounds.json, leeg = geen geluid)
  sound-fall: "block.wood.break"
  sound-land: "entity.zombie.break_wooden_door"
  # Stofwolkjes waar de boom neerkomt
  particles: true

# Voor elk blok een gewone 'blok kapot'-melding naar andere plugins: claims worden gerespecteerd,
# CoreProtect logt alles en elk blok hout geeft Houthakken-XP.
break-events: true

# Wat aan een boom hangt of erop ligt en meegaat (alleen als het echt aan de boom vastzit)
attachments:
  - VINE
  - COCOA
  - MOSS_CARPET
  - PALE_HANGING_MOSS
  - MANGROVE_PROPAGULE
  - SNOW

# De boomsoorten. branch-distance = hoe ver takken van de stam af mogen zitten,
# leaf-distance = hoe ver bladeren van het hout af mogen zitten.
# Hout dat aan planken, trappen, glas, deuren, bordjes, ... vastzit, valt nooit om (dan is het een bouwwerk).
trees:
  oak:
    logs: [OAK_LOG]
    leaves: [OAK_LEAVES]
    sapling: OAK_SAPLING
    branch-distance: 6
    leaf-distance: 6
  azalea:
    logs: [OAK_LOG]
    leaves: [AZALEA_LEAVES, FLOWERING_AZALEA_LEAVES]
    sapling: AZALEA
    branch-distance: 3
    leaf-distance: 4
  spruce:
    logs: [SPRUCE_LOG]
    leaves: [SPRUCE_LEAVES]
    sapling: SPRUCE_SAPLING
    branch-distance: 2
    leaf-distance: 6
  birch:
    logs: [BIRCH_LOG]
    leaves: [BIRCH_LEAVES]
    sapling: BIRCH_SAPLING
    branch-distance: 1
    leaf-distance: 4
  jungle:
    logs: [JUNGLE_LOG]
    leaves: [JUNGLE_LEAVES]
    sapling: JUNGLE_SAPLING
    branch-distance: 6
    leaf-distance: 6
  acacia:
    logs: [ACACIA_LOG]
    leaves: [ACACIA_LEAVES]
    sapling: ACACIA_SAPLING
    branch-distance: 5
    leaf-distance: 5
  dark_oak:
    logs: [DARK_OAK_LOG]
    leaves: [DARK_OAK_LEAVES]
    sapling: DARK_OAK_SAPLING
    branch-distance: 4
    leaf-distance: 5
  mangrove:
    logs: [MANGROVE_LOG]
    leaves: [MANGROVE_LEAVES]
    sapling: MANGROVE_PROPAGULE
    branch-distance: 8
    leaf-distance: 6
  cherry:
    logs: [CHERRY_LOG]
    leaves: [CHERRY_LEAVES]
    sapling: CHERRY_SAPLING
    branch-distance: 10
    leaf-distance: 6
  pale_oak:
    logs: [PALE_OAK_LOG]
    leaves: [PALE_OAK_LEAVES]
    sapling: PALE_OAK_SAPLING
    branch-distance: 4
    leaf-distance: 5
