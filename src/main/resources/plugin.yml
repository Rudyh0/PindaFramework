name: PindaFramework
version: '${version}'
main: nl.pinda.framework.PindaFramework
api-version: '26.1'
author: Rudyh0
description: Het all-in-one framework voor de server.
# Optioneel: met PlaceholderAPI werken %placeholders% in onze teksten en %pinda_...% in andere plugins
softdepend: [PlaceholderAPI]

# SQLite-driver voor de database en ZXing voor QR-codes (2FA). Paper downloadt deze automatisch bij de eerste start.
libraries:
  - org.xerial:sqlite-jdbc:3.46.1.2
  - com.google.zxing:core:3.5.3

permissions:
  pinda.admin:
    description: Alle beheerrechten van PindaFramework
    default: op
    children:
      pinda.admin.reload: true
      pinda.admin.modules: true
      pinda.admin.setup: true
  pinda.admin.reload:
    description: Configuratie en taalbestanden herladen met /pinda reload
    default: op
  pinda.admin.modules:
    description: Overzicht van modules bekijken met /pinda modules
    default: op
  pinda.admin.setup:
    description: Het setupmenu (opnieuw) openen met /pinda setup
    default: op
  pinda.settings.use:
    description: Persoonlijke instellingen openen met /instellingen
    default: true
  pinda.language.use:
    description: Je taal wijzigen met /taal
    default: true

  # Teleports (algemeen). Standaard voor niemand, zodat je wachttijd en cooldown zelf kunt testen.
  pinda.teleport.bypass.warmup:
    description: Direct teleporteren zonder wachttijd
    default: false
  pinda.teleport.bypass.cooldown:
    description: Geen cooldown tussen teleports
    default: false
  pinda.teleport.free:
    description: Teleports kosten nooit geld
    default: false

  # Homes. Meer homes per rank met pinda.homes.limit.<aantal>, bijv. pinda.homes.limit.10
  pinda.homes.use:
    description: /sethome, /home, /delhome en /homes
    default: true
  pinda.homes.unlimited:
    description: Onbeperkt aantal homes
    default: false
  pinda.homes.others:
    description: Homes van anderen bekijken en erheen gaan (/homes <speler>, /home speler:naam)
    default: op
  pinda.homes.others.delete:
    description: Homes van anderen verwijderen
    default: op

  # TPA
  pinda.tpa.use:
    description: /tpa, /tpaccept, /tpdeny en /tpacancel
    default: true
  pinda.tpa.here:
    description: /tpahere
    default: true

  # Spawn
  pinda.spawn.use:
    description: /spawn
    default: true
  pinda.spawn.set:
    description: /setspawn
    default: op

  # Back
  pinda.back.use:
    description: /back na een teleport
    default: true
  pinda.back.death:
    description: /back naar de plek waar je doodging
    default: true

  # Privéberichten
  pinda.msg.use:
    description: /msg en /r
    default: true
  pinda.msg.socialspy:
    description: /socialspy, privéberichten van anderen meelezen
    default: op
  pinda.msg.bypass:
    description: Berichten sturen naar spelers die privéberichten uit hebben staan
    default: op
  pinda.ignore.use:
    description: /ignore
    default: true
  pinda.ignore.exempt:
    description: Kan niet genegeerd worden (voor staff)
    default: op

  # Spelmodus
  pinda.gamemode.survival:
    description: /gms of /gm survival
    default: op
  pinda.gamemode.creative:
    description: /gmc of /gm creative
    default: op
  pinda.gamemode.adventure:
    description: /gma of /gm adventure
    default: op
  pinda.gamemode.spectator:
    description: /gmsp of /gm spectator
    default: op
  pinda.gamemode.others:
    description: De spelmodus van andere spelers veranderen
    default: op

  # AFK
  pinda.afk.use:
    description: /afk
    default: true
  pinda.afk.kick-exempt:
    description: Wordt nooit gekickt voor AFK
    default: op

  # Handige commando's
  pinda.fly:
    description: /fly
    default: op
  pinda.fly.others:
    description: /fly <speler>
    default: op
  pinda.heal:
    description: /heal
    default: op
  pinda.heal.others:
    description: /heal <speler>
    default: op
  pinda.feed:
    description: /feed
    default: op
  pinda.feed.others:
    description: /feed <speler>
    default: op
  pinda.god:
    description: /god
    default: op
  pinda.god.others:
    description: /god <speler>
    default: op
  pinda.speed:
    description: /speed
    default: op
  pinda.speed.others:
    description: /speed <snelheid> <speler>
    default: op

  # Staff
  pinda.vanish:
    description: /vanish
    default: op
  pinda.vanish.others:
    description: /vanish <speler>
    default: op
  pinda.vanish.see:
    description: Onzichtbare staff toch zien
    default: op
  pinda.invsee:
    description: /invsee, inventory van anderen bekijken
    default: op
  pinda.invsee.modify:
    description: Items aanpassen in de inventory van anderen
    default: op

  # Economy
  pinda.eco.balance:
    description: /balance
    default: true
  pinda.eco.balance.others:
    description: /balance <speler>
    default: op
  pinda.eco.pay:
    description: /pay
    default: true
  pinda.eco.bank:
    description: /bank
    default: true
  pinda.eco.baltop:
    description: /baltop
    default: true
  pinda.eco.admin:
    description: /eco give|take|set
    default: op
  pinda.eco.keep-cash:
    description: Geen contant geld verliezen bij doodgaan
    default: false

  # Shops
  pinda.shop.use:
    description: /shop, de marktplaats en kopen
    default: true
  pinda.shop.sign:
    description: Een shopbord plaatsen met [shop]
    default: true
  pinda.shop.admin:
    description: Shopborden van anderen afbreken
    default: op

  # Sloten en partners
  pinda.partner.use:
    description: /partner en partners via /instellingen
    default: true
  pinda.lock.bypass:
    description: Bij alle afgesloten kisten en deuren kunnen (staff)
    default: op

  # Rangen en chat
  pinda.rank.set:
    description: /rank set, rangen geven
    default: op
  pinda.rank.info:
    description: /rank info, je eigen rang bekijken
    default: true
  pinda.rank.info.others:
    description: /rank info <speler>
    default: op
  pinda.rank.list:
    description: /rank list
    default: true
  pinda.chat.format:
    description: Kleuren en opmaak gebruiken in de chat
    default: op

  # Moderatie
  pinda.mod.kick:
    description: /kick
    default: op
  pinda.mod.ban:
    description: /ban en /tempban (tijdelijk, tot max-temp-ban)
    default: op
  pinda.mod.ban.permanent:
    description: Permanent bannen en langer dan max-temp-ban
    default: op
  pinda.mod.unban:
    description: /unban
    default: op
  pinda.mod.mute:
    description: /mute en /unmute
    default: op
  pinda.mod.warn:
    description: /warn
    default: op
  pinda.mod.history:
    description: /history en /banlist
    default: op
  pinda.mod.notify:
    description: Meldingen zien als iemand gestraft wordt
    default: op

  # Skills
  pinda.skills.use:
    description: /skills, je eigen skills en de ranglijst
    default: true
  pinda.skills.others:
    description: /skills <speler>, de skills van anderen bekijken
    default: true
  pinda.skills.admin:
    description: /skills set, addxp, reset en boost
    default: op

  # Toplijsten en antilag
  pinda.top.use:
    description: /top, de toplijsten bekijken
    default: true
  pinda.antilag.use:
    description: /lag en /lag chunks, zien hoe het met de server gaat
    default: op
  pinda.antilag.admin:
    description: /lag clear (items opruimen) en /lag tp (naar een drukke chunk)
    default: op
  pinda.antilag.notify:
    description: Een melding krijgen als de server laggt
    default: op

  # Rugtas
  pinda.backpack.use:
    description: /backpack (/bp, /rugtas, /rugzak, /rt, /rz), je eigen rugtas
    default: true
  pinda.backpack.loot:
    description: Een gevallen rugtas van iemand anders looten
    default: true
  pinda.backpack.others:
    description: /backpack <speler>, de rugtas van iemand anders bekijken
    default: op
  pinda.backpack.others.edit:
    description: Items in de rugtas van iemand anders aanpassen
    default: op

  # Bomen kappen
  pinda.timber.use:
    description: Bomen in één keer omhakken, en /timber om het aan of uit te zetten
    default: true
  pinda.timber.bypass-cooldown:
    description: Geen wachttijd tussen twee bomen
    default: op

  # Slapen
  pinda.sleep.exempt:
    description: Telt niet mee bij het aantal spelers dat moet slapen
    default: false

  # Webpaneel (/panel)
  pinda.panel.*:
    description: Alles in het webpaneel
    default: op
    children:
      pinda.panel.use: true
      pinda.panel.players: true
      pinda.panel.moderate: true
      pinda.panel.economy.view: true
      pinda.panel.economy.edit: true
      pinda.panel.ranks: true
      pinda.panel.shops: true
      pinda.panel.shops.manage: true
      pinda.panel.server: true
      pinda.panel.stop: true
      pinda.panel.console: true
      pinda.panel.log: true
      pinda.panel.skills: true
      pinda.panel.skills.edit: true
      pinda.panel.config: true
      pinda.panel.texts: true
      pinda.panel.ranks.edit: true
      pinda.panel.players.manage: true
      pinda.panel.security: true
      pinda.panel.broadcasts: true
  pinda.panel.use:
    description: /panel, inloggen op het webpaneel en het dashboard zien
    default: op
  pinda.panel.players:
    description: Paneel - spelers zoeken en profielen en straffen bekijken
    default: op
  pinda.panel.moderate:
    description: Paneel - kicken, waarschuwen, muten en bannen (zelfde regels als in-game)
    default: op
  pinda.panel.economy.view:
    description: Paneel - saldo's en transacties bekijken
    default: op
  pinda.panel.economy.edit:
    description: Paneel - geld geven, afnemen en saldo's instellen
    default: op
  pinda.panel.ranks:
    description: Paneel - rangen geven (alleen lager dan je eigen rang, behalve operators)
    default: op
  pinda.panel.shops:
    description: Paneel - shops bekijken
    default: op
  pinda.panel.shops.manage:
    description: Paneel - shops sluiten
    default: op
  pinda.panel.server:
    description: Paneel - tijd, weer, mededelingen, whitelist, opslaan en herladen
    default: op
  pinda.panel.stop:
    description: Paneel - de server stoppen
    default: op
  pinda.panel.console:
    description: Paneel - de serverconsole lezen en commando's uitvoeren
    default: op
  pinda.panel.log:
    description: Paneel - het logboek en actieve sessies bekijken
    default: op
  pinda.panel.skills:
    description: Paneel - skills en ranglijsten bekijken
    default: op
  pinda.panel.skills.edit:
    description: Paneel - levels aanpassen en XP-boosts starten
    default: op
  pinda.panel.config:
    description: Paneel - alle instellingen, MOTD, server.properties, spelregels en Discord
    default: op
  pinda.panel.texts:
    description: Paneel - alle teksten en het uiterlijk (prefix, kleuren) aanpassen
    default: op
  pinda.panel.ranks.edit:
    description: Paneel - rangen maken, bewerken en verwijderen
    default: op
  pinda.panel.players.manage:
    description: Paneel - speleracties (spelmodus, healen, teleporteren, inventory, items, homes)
    default: op
  pinda.panel.security:
    description: Paneel - de 2FA van anderen resetten
    default: op
  pinda.panel.broadcasts:
    description: Paneel - automatische aankondigingen beheren en versturen
    default: op
