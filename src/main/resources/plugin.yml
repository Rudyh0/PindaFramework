name: PindaFramework
version: '${version}'
main: nl.pinda.framework.PindaFramework
api-version: '26.1'
author: Rudyh0
description: Het all-in-one framework voor de server.

# SQLite-driver voor de database. Paper downloadt deze automatisch bij de eerste start.
libraries:
  - org.xerial:sqlite-jdbc:3.46.1.2

permissions:
  pinda.admin:
    description: Alle beheerrechten van PindaFramework
    default: op
    children:
      pinda.admin.reload: true
      pinda.admin.modules: true
      pinda.admin.setup: true
  pinda.admin.reload:
    description: Configuratie en taalbestanden herladen met /pinda reload
    default: op
  pinda.admin.modules:
    description: Overzicht van modules bekijken met /pinda modules
    default: op
  pinda.admin.setup:
    description: Het setupmenu (opnieuw) openen met /pinda setup
    default: op
  pinda.settings.use:
    description: Persoonlijke instellingen openen met /instellingen
    default: true
  pinda.language.use:
    description: Je taal wijzigen met /taal
    default: true

  # Teleports (algemeen). Standaard voor niemand, zodat je wachttijd en cooldown zelf kunt testen.
  pinda.teleport.bypass.warmup:
    description: Direct teleporteren zonder wachttijd
    default: false
  pinda.teleport.bypass.cooldown:
    description: Geen cooldown tussen teleports
    default: false
  pinda.teleport.free:
    description: Teleports kosten nooit geld
    default: false

  # Homes. Meer homes per rank met pinda.homes.limit.<aantal>, bijv. pinda.homes.limit.10
  pinda.homes.use:
    description: /sethome, /home, /delhome en /homes
    default: true
  pinda.homes.unlimited:
    description: Onbeperkt aantal homes
    default: false
  pinda.homes.others:
    description: Homes van anderen bekijken en erheen gaan (/homes <speler>, /home speler:naam)
    default: op
  pinda.homes.others.delete:
    description: Homes van anderen verwijderen
    default: op

  # TPA
  pinda.tpa.use:
    description: /tpa, /tpaccept, /tpdeny en /tpacancel
    default: true
  pinda.tpa.here:
    description: /tpahere
    default: true

  # Spawn
  pinda.spawn.use:
    description: /spawn
    default: true
  pinda.spawn.set:
    description: /setspawn
    default: op

  # Back
  pinda.back.use:
    description: /back na een teleport
    default: true
  pinda.back.death:
    description: /back naar de plek waar je doodging
    default: true

  # Privéberichten
  pinda.msg.use:
    description: /msg en /r
    default: true
  pinda.msg.socialspy:
    description: /socialspy, privéberichten van anderen meelezen
    default: op
  pinda.msg.bypass:
    description: Berichten sturen naar spelers die privéberichten uit hebben staan
    default: op
  pinda.ignore.use:
    description: /ignore
    default: true
  pinda.ignore.exempt:
    description: Kan niet genegeerd worden (voor staff)
    default: op

  # Spelmodus
  pinda.gamemode.survival:
    description: /gms of /gm survival
    default: op
  pinda.gamemode.creative:
    description: /gmc of /gm creative
    default: op
  pinda.gamemode.adventure:
    description: /gma of /gm adventure
    default: op
  pinda.gamemode.spectator:
    description: /gmsp of /gm spectator
    default: op
  pinda.gamemode.others:
    description: De spelmodus van andere spelers veranderen
    default: op
