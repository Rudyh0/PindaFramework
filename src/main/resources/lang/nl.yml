  console-name: "Console"
  hover-reply: "<text>Klik om te antwoorden"
  self: "<prefix><error>Je kunt jezelf geen bericht sturen."
  disabled-target: "<prefix><error><player> ontvangt op dit moment geen privéberichten."
  no-reply: "<prefix><error>Je hebt niemand om op te antwoorden."
  partner-offline: "<prefix><error>Degene met wie je praatte is niet meer online."
  socialspy-on: "<prefix><text>Socialspy staat <success>aan</success>. Je leest privéberichten mee."
  socialspy-off: "<prefix><text>Socialspy staat <error>uit</error>."
  ignore-added: "<prefix><text>Je negeert <primary><player></primary> nu. <muted>Privéberichten en TPA-verzoeken worden geblokkeerd."
