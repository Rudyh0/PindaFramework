  full: "<prefix><error>Your shop is full."
  inventory-full: "<prefix><error>Your inventory is full."
  opened: "<prefix><success>Your shop is open! <muted>It stays open while you're online."
  opened-empty: "<prefix><text>Your shop is set to open, but nothing is for sale yet. <muted>Give your items a price."
  open-failed: "<prefix><error>Your shop couldn't open: you don't have enough money for the marketplace fee."
  closed-by-owner: "<prefix><text>Your shop is closed."
  reopened: "<prefix><text>Your shop is open again."
  reopened-empty: "<prefix><text>Your shop is set to open, but it's sold out. <muted>Restock it with /shop."
  fee-paid: "<prefix><muted>Today's marketplace fee paid: <text><amount></text>."
  fee-failed: "<prefix><error>Your shop is closed: you don't have enough money for the marketplace fee of <highlight><amount></highlight>."
  closed: "<prefix><error><highlight><player></highlight>'s shop is closed right now."
  own-shop: "<prefix><error>You can't buy from your own shop."
  bought: "<prefix><success>Bought <amount>x <item> <text>for <primary><price></primary> at <primary><shop></primary>."
  sold: "<prefix><success><player> bought <amount>x <item> <text>for <primary><price></primary>. <muted>After <tax> tax: +<net> to your bank."
  item-sold-out: "<prefix><warning><item> is sold out."
  sold-out: "<prefix><warning>Your shop is sold out and therefore closed to buyers. <muted>Restock it with /shop."
  sign-no-shop: "<prefix><error>You don't have a shop yet. Create one first with <primary>/shop</primary>."
  sign-limit: "<prefix><error>You already have a shop sign at <highlight><x>, <y>, <z></highlight>. Break that one first."
  sign-created: "<prefix><success>Shop sign placed! <text>Players can click it to open your shop."
  sign-protected: "<prefix><error>This shop sign belongs to <highlight><player></highlight>."
  sign-broken: "<prefix><text>Your shop sign has been removed. <muted>Place a new sign with [shop] to put it back."
  sign-broken-support: "<prefix><text>The block under your shop sign is gone, and so is the sign."
  menu:
    back: "<primary>« Back"
  status:
    open: "<success>● Open"
    closed: "<error>● Closed"
    sold-out: "<warning>● Sold out"
    offline: "<muted>● Owner offline"
    fee-unpaid: "<warning>● Fee not paid"
  sign:
