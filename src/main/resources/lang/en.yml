      unavailable: "<error>Not enough cash"
    deposit-all: "<success><bold>Deposit all <muted>(<amount>)"
    withdraw:
      name: "<warning><bold>Withdraw <amount>"
      lore:
        - "<muted>Goes to your cash."
      unavailable: "<error>Not enough in the bank"
    withdraw-all: "<warning><bold>Withdraw all <muted>(<amount>)"

shop:
