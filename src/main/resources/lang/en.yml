# ┌──────────────────────────────────────────────┐
# │           PindaFramework - English           │
# └──────────────────────────────────────────────┘
# Format: MiniMessage (https://docs.advntr.dev/minimessage/format)
# Theme tags from config.yml: <primary> <secondary> <text> <muted> <highlight> <success> <error> <warning>,
# <prefix> and <server> (the server name).
# Leave a message empty ("") to disable it.
# Start a message with [actionbar] to show it above the hotbar instead of in chat.

language:
  name: "English"
  icon: BLUE_BANNER
  client-locales: [en]

general:
  no-permission: "<prefix><error>You don't have permission to do that."
  player-only: "<prefix><error>Only players can use this command."
  player-not-found: "<prefix><error>Player <highlight><player></highlight> is not online."
  player-unknown: "<prefix><error>Player <highlight><player></highlight> has never been on <server>."
  command-error: "<prefix><error>Something went wrong with this command. Please tell a staff member."
  data-load-failed: "<error>Your player data could not be loaded.<newline><text>Please try again in a few seconds."
  enabled: "<success>On"
  disabled: "<error>Off"

settings:
  menu:
    title: "<dark_gray>Settings"
    title-setup: "<dark_gray>Welcome to <server>!"
    head:
      name: "<primary><bold><player>"
      lore-setup:
        - "<text>Great to have you here!"
        - "<text>Pick your language and preferences."
        - ""
        - "<muted>You can always change this later"
        - "<muted>with <primary>/settings</primary>."
      lore:
        - "<text>Change your preferences here."
        - "<text>Changes are saved right away."
    language:
      name: "<primary><language>"
      lore-selected:
        - "<success>✔ Selected"
      lore-select:
        - "<muted>» Click to choose this language"
    toggle:
      status: "<text>Status: <status>"
      click: "<muted>» Click to toggle"
      indicator-on: "<success><bold>ON"
      indicator-off: "<error><bold>OFF"
    confirm:
      name: "<success><bold>Done!"
      lore:
        - "<text>Save your choices and"
        - "<text>start playing."
    close:
      name: "<error><bold>Close"
      lore: []

  toggles:
    tips:
      name: "<primary>Tips"
      description:
        - "<text>A useful tip about <server>"
        - "<text>in chat every now and then."
    tpa:
      name: "<primary>TPA requests"
      description:
        - "<text>Other players can ask"
        - "<text>to teleport to you."
    msg:
      name: "<primary>Private messages"
      description:
        - "<text>Other players can send"
        - "<text>you messages with /msg."

  setup:
    done: "<prefix><success>Your preferences have been saved! <text>Have fun on <primary><server></primary>."
    done-title: "<gradient:#FFC857:#E9724C><bold><server>"
    done-subtitle: "<text>Welcome, <primary><player></primary>!"
    skipped: "<prefix><text>You can always change your preferences with <click:run_command:/settings><hover:show_text:'<text>Click to open'><primary>/settings</primary></hover></click>."

  language-changed: "<prefix><text>Your language has been set to <primary><language></primary>."
  language-unknown: "<prefix><error>Unknown language <highlight><language></highlight>. <text>Available: <primary><languages></primary>"

tips:
  format: "<secondary>✦ <bold>Tip</bold> <muted>» <text><tip>"
  list:
    - "Change your language and preferences with <click:run_command:/settings><hover:show_text:'<text>Click to open'><primary>/settings</primary></hover></click>."
    - "Quickly switch languages with <primary>/language</primary>. <muted>(Nederlands / English)"
    - "Rather not get tips? Turn them off in <click:run_command:/settings><hover:show_text:'<text>Click to open'><primary>/settings</primary></hover></click>."
    - "Set a home with <primary>/sethome [name]</primary> and see them all with <click:run_command:/homes><hover:show_text:'<text>Click to open'><primary>/homes</primary></hover></click>."
    - "Want to visit a friend? Use <primary>/tpa [player]</primary>."
    - "Died? Use <primary>/back</primary> to return to that spot."
    - "Send someone a private message with <primary>/msg [player] [message]</primary> and reply quickly with <primary>/r</primary>."
    - "Stepping away? Type <primary>/afk</primary> so others know you might not respond."
    - "Put your money in the <primary>/bank</primary> in time: you lose your cash when you die."

menu:
  previous: "<primary>« Previous page"
  next: "<primary>Next page »"
  confirm:
    title: "<dark_gray>Are you sure?"
    accept: "<success><bold>Yes"
    decline: "<error><bold>No, cancel"

teleport:
  warmup: "<prefix><text>Teleporting in <primary><seconds></primary> seconds. <muted>Don't move!"
  countdown: "[actionbar]<text>Teleporting in <primary><bold><seconds></bold></primary>..."
  cancelled-move: "<prefix><error>Teleport cancelled: you moved."
  cancelled-damage: "<prefix><error>Teleport cancelled: you took damage."
  already-pending: "<prefix><error>You are already teleporting."
  cooldown: "<prefix><error>Please wait <highlight><seconds></highlight> more seconds before teleporting again."
  no-money: "<prefix><error>You don't have enough money. This teleport costs <highlight><cost></highlight>."
  paid: "<prefix><muted>This teleport cost <text><cost></text>."
  no-safe-location: "<prefix><error>No safe spot was found at the destination."
  destination-gone: "<prefix><error>The destination is no longer available."
  failed: "<prefix><error>Teleporting failed."
  cost-line: "<muted>Cost: <text><cost>"
  cost-free: "<muted>Cost: <success>Free"

homes:
  set: "<prefix><success>Home <primary><home></primary> has been set. <muted>(<count>/<limit>)"
  updated: "<prefix><success>Home <primary><home></primary> has been moved to your current spot."
  deleted: "<prefix><text>Home <primary><home></primary> has been deleted."
  teleported: "<prefix><text>Welcome home! <muted>(<home>)"
  not-found: "<prefix><error>You don't have a home called <highlight><home></highlight>."
  none: "<prefix><text>You don't have any homes yet. Set one with <click:suggest_command:/sethome ><hover:show_text:'<text>Click to fill in'><primary>/sethome [name]</primary></hover></click>."
  limit-reached: "<prefix><error>You've reached the maximum of <highlight><limit></highlight> homes. <text>Delete one first with <primary>/delhome</primary>."
  invalid-name: "<prefix><error>A home name can only contain letters, numbers, - and _ (max. 16 characters)."
  world-blocked: "<prefix><error>You can't set a home in this world."
  world-missing: "<prefix><error>The world of this home no longer exists."
  usage-delhome: "<prefix><text>Usage: <primary>/delhome <name>"
  player-unknown: "<prefix><error>Player <highlight><player></highlight> has never been on <server>."
  others-not-found: "<prefix><error><player> doesn't have a home called <highlight><home></highlight>."
  others-teleported: "<prefix><text>You're at <primary><player></primary>'s home <primary><home></primary>."
  others-deleted: "<prefix><text>Home <primary><home></primary> of <primary><player></primary> has been deleted."
  menu:
    title: "<dark_gray>Your homes (<count>/<limit>)"
    title-others: "<dark_gray>Homes of <player>"
    item:
      name: "<primary><bold><home>"
      info:
        - "<muted>World: <text><world>"
        - "<muted>Location: <text><x>, <y>, <z>"
      actions:
        - "<muted>» <text>Click to teleport"
        - "<muted>» <text>Shift-click to delete"
      actions-no-delete:
        - "<muted>» <text>Click to teleport"
    empty:
      name: "<text>No homes yet"
      lore:
        - "<muted>Set your first home with"
        - "<primary>/sethome [name]"
    info:
      name: "<primary><bold>Your homes"
      name-others: "<primary><bold>Homes of <player>"
      lore:
        - "<text>You have <primary><count></primary> of <primary><limit></primary> homes."
        - ""
        - "<muted>New home: <primary>/sethome [name]"
      lore-others:
        - "<text><player> has <primary><count></primary> homes."
    delete-subject: "<error><bold>Delete home <home>"

tpa:
  usage: "<prefix><text>Usage: <primary>/<command> <player>"
  sent: "<prefix><text>Request sent to <primary><player></primary>. <muted>Expires in <seconds>s.</muted> <click:run_command:/tpacancel><hover:show_text:'<text>Click to cancel'><error>[Cancel]</error></hover></click>"
  sent-here: "<prefix><text>You asked <primary><player></primary> to come to you. <muted>Expires in <seconds>s.</muted> <click:run_command:/tpacancel><hover:show_text:'<text>Click to cancel'><error>[Cancel]</error></hover></click>"
  received:
    - ""
    - "<prefix><primary><player></primary> <text>wants to teleport to you."
    - "   <accept><success><bold>[ACCEPT]</bold></success></accept>   <deny><error><bold>[DENY]</bold></error></deny>"
    - ""
  received-here:
    - ""
    - "<prefix><primary><player></primary> <text>wants to teleport you to them."
    - "   <accept><success><bold>[ACCEPT]</bold></success></accept>   <deny><error><bold>[DENY]</bold></error></deny>"
    - ""
  hover-accept: "<text>Click to accept"
  hover-deny: "<text>Click to deny"
  accepted-target: "<prefix><success>Accepted the request from <player>."
  accepted-sender: "<prefix><success><player> accepted your request."
  denied-target: "<prefix><text>Denied the request from <primary><player></primary>."
  denied-sender: "<prefix><error><player> denied your request."
  cancelled-sender: "<prefix><text>Your request to <primary><player></primary> has been cancelled."
  cancelled-target: "<prefix><text><primary><player></primary> cancelled the request."
  expired-sender: "<prefix><text>Your request to <primary><player></primary> has expired."
  expired-target: "<prefix><text>The request from <primary><player></primary> has expired."
  no-request: "<prefix><error>You don't have any pending requests."
  no-request-from: "<prefix><error>You don't have a request from <highlight><player></highlight>."
  no-outgoing: "<prefix><error>You don't have a pending request to cancel."
  self: "<prefix><error>You can't send a request to yourself."
  disabled-target: "<prefix><error><player> isn't accepting TPA requests right now."
  already-sent: "<prefix><error>You already sent <player> a request."
  teleported: "<prefix><text>You're at <primary><player></primary>."

spawn:
  teleported: "<prefix><text>You're at the <primary><server></primary> spawn."
  set: "<prefix><success>The spawn has been set to your current spot."

back:
  teleported: "<prefix><text>You're back at your previous spot."
  none: "<prefix><error>There's no previous spot to go back to."
  death-hint: "<prefix><text>Go back to where you died? <click:run_command:/back><hover:show_text:'<text>Click to go back'><primary>[/back]</primary></hover></click>"

msg:
  usage: "<prefix><text>Usage: <primary>/msg <player> <message>"
  usage-reply: "<prefix><text>Usage: <primary>/r <message>"
  format-sent: "<muted>[<primary>you</primary> → <reply><primary><target></primary></reply>] <text><message>"
  format-received: "<muted>[<reply><primary><sender></primary></reply> → <primary>you</primary>] <text><message>"
  format-spy: "<muted>[Spy] <sender> → <target>: <message>"
  console-name: "Console"
  hover-reply: "<text>Click to reply"
  self: "<prefix><error>You can't send a message to yourself."
  disabled-target: "<prefix><error><player> isn't receiving private messages right now."
  no-reply: "<prefix><error>You have nobody to reply to."
  partner-offline: "<prefix><error>The person you were talking to is no longer online."
  socialspy-on: "<prefix><text>Socialspy is <success>on</success>. You can read private messages."
  socialspy-off: "<prefix><text>Socialspy is <error>off</error>."
  ignore-added: "<prefix><text>You are now ignoring <primary><player></primary>. <muted>Private messages and TPA requests are blocked."
  ignore-removed: "<prefix><text>You are no longer ignoring <primary><player></primary>."
  ignore-self: "<prefix><error>You can't ignore yourself."
  ignore-exempt: "<prefix><error>You can't ignore <player>."
  ignore-list: "<prefix><text>You are ignoring: <primary><players>"
  ignore-list-empty: "<prefix><text>You aren't ignoring anyone. <muted>Use <primary>/ignore <player></primary>."

gamemode:
  modes:
    survival: "Survival"
    creative: "Creative"
    adventure: "Adventure"
    spectator: "Spectator"
  changed: "<prefix><text>Your game mode is now <primary><mode></primary>."
  changed-other: "<prefix><text><primary><player></primary>'s game mode is now <primary><mode></primary>."
  changed-by: "<prefix><text><primary><player></primary> changed your game mode to <primary><mode></primary>."
  unknown-mode: "<prefix><error>Unknown game mode <highlight><mode></highlight>. <text>Choose from: <primary>survival, creative, adventure, spectator</primary>"
  usage: "<prefix><text>Usage: <primary>/gm <mode> [player]</primary> <muted>or /gmc, /gms, /gma, /gmsp"
  usage-console: "<prefix><text>From the console, add a player: <primary>/<command> ... <player>"

afk:
  now-afk: "<prefix><muted><player> is now AFK."
  now-afk-reason: "<prefix><muted><player> is now AFK: <reason>"
  no-longer-afk: "<prefix><muted><player> is back."
  target-afk: "<prefix><muted><player> is AFK and might not respond right away."
  kick: "<error>You were kicked from <server> for being AFK too long."
  tab-suffix: " <gray>[AFK]"

utility:
  fly-on: "<prefix><text>Flying is <success>on</success>."
  fly-off: "<prefix><text>Flying is <error>off</error>."
  fly-on-other: "<prefix><text>Flying is <success>on</success> for <primary><player></primary>."
  fly-off-other: "<prefix><text>Flying is <error>off</error> for <primary><player></primary>."
  healed: "<prefix><success>You have been fully healed."
  healed-other: "<prefix><success><player> has been fully healed."
  fed: "<prefix><success>You're no longer hungry."
  fed-other: "<prefix><success><player> is no longer hungry."
  god-on: "<prefix><text>God mode is <success>on</success>. You're invulnerable."
  god-off: "<prefix><text>God mode is <error>off</error>."
  god-on-other: "<prefix><text>God mode is <success>on</success> for <primary><player></primary>."
  god-off-other: "<prefix><text>God mode is <error>off</error> for <primary><player></primary>."
  speed-set: "<prefix><text>Your <type> is now <primary><speed></primary>."
  speed-set-other: "<prefix><text><primary><player></primary>'s <type> is now <primary><speed></primary>."
  speed-usage: "<prefix><text>Usage: <primary>/speed [walk|fly] <1-10> [player]"
  speed-types:
    walk: "walking speed"
    fly: "flying speed"

vanish:
  enabled: "<prefix><text>You are now <success>invisible</success>."
  disabled: "<prefix><text>You are <primary>visible</primary> again."
  on-other: "<prefix><primary><player></primary> <text>is now invisible."
  off-other: "<prefix><primary><player></primary> <text>is visible again."
  staff-on: "<prefix><muted><player> turned invisible."
  staff-off: "<prefix><muted><player> is visible again."
  still-vanished: "<prefix><text>You are still <success>invisible</success>. <muted>Nobody saw you join."
  actionbar: "[actionbar]<muted>You are invisible"

invsee:
  usage: "<prefix><text>Usage: <primary>/invsee <player>"
  self: "<prefix><error>Just press E to open your own inventory."
  opened: "<prefix><text>You're viewing <primary><player></primary>'s inventory."
  opened-read-only: "<prefix><text>You're viewing <primary><player></primary>'s inventory. <muted>(view only)"

economy:
  money-item: "<gold><bold><amount>"
  death-dropped: "<prefix><error>You lost <highlight><amount></highlight> in cash. <muted>It's lying where you died; first come, first served."
  death-lost: "<prefix><error>You lost <highlight><amount></highlight> in cash."
  money-picked-up: "[actionbar]<success>+ <amount> picked up"
  playtime-bonus: "<prefix><success>+ <amount> <text>bonus for playing <primary><minutes> minutes</primary> on <server>!"
  balance-own:
    - "<prefix><text>Your balance"
    - " <muted>Cash: <primary><cash>"
    - " <muted>Bank: <primary><bank>"
    - " <muted>Total: <text><total>"
  balance:
    - "<prefix><text>Balance of <primary><player>"
    - " <muted>Cash: <primary><cash>"
    - " <muted>Bank: <primary><bank>"
    - " <muted>Total: <text><total>"
  usage-pay: "<prefix><text>Usage: <primary>/pay <player> <amount>"
  invalid-amount: "<prefix><error><highlight><input></highlight> is not a valid amount."
  pay-self: "<prefix><error>You can't pay yourself."
  pay-minimum: "<prefix><error>You have to pay at least <highlight><amount></highlight>."
  pay-failed: "<prefix><error>The payment failed. Your money has been returned."
  not-enough: "<prefix><error>You don't have enough money. <muted>(available: <amount>)"
  paid: "<prefix><text>You paid <primary><amount></primary> to <primary><player></primary>."
  received: "<prefix><success>You received <amount> from <player>."
  bank-usage: "<prefix><text>Usage: <primary>/bank</primary> <muted>or</muted> <primary>/bank deposit|withdraw <amount|all>"
  deposited: "<prefix><text>You deposited <primary><amount></primary>. <muted>Fee: <fee> · added to bank: <credited>"
  withdrew: "<prefix><text>You withdrew <primary><amount></primary>."
  not-enough-cash: "<prefix><error>You don't have enough cash. <muted>(cash: <amount>)"
  not-enough-bank: "<prefix><error>You don't have enough in the bank. <muted>(balance: <amount>)"
  baltop-header: "<prefix><primary><bold>Richest players on <server>"
  baltop-entry: " <muted>#<rank> <primary><player></primary> <muted>» <text><amount>"
  baltop-empty: "<prefix><text>Nobody has any money yet."
  admin-usage: "<prefix><text>Usage: <primary>/eco give|take|set <player> <amount> [bank|cash]"
  admin-given: "<prefix><success>Gave <amount> to <player>. <muted>(<where>)"
  admin-taken: "<prefix><success>Took <amount> from <player>. <muted>(<where>)"
  admin-set: "<prefix><success><player>'s balance is now <amount>. <muted>(<where>)"
  where-cash: "cash"
  where-bank: "bank"
  bank-menu:
    title: "<dark_gray><server> Bank"
    info:
      name: "<primary><bold>Your money"
      lore:
        - "<muted>Cash: <text><cash>"
        - "<muted>Bank: <text><bank>"
        - ""
        - "<muted>Deposit fee: <text><fee-percent>%"
        - "<muted>You lose your cash when you die."
    deposit:
      name: "<success><bold>Deposit <amount>"
      lore:
        - "<muted>Fee: <text><fee>"
        - "<muted>Added to bank: <text><credited>"
      unavailable: "<error>Not enough cash"
    deposit-all: "<success><bold>Deposit all <muted>(<amount>)"
    withdraw:
      name: "<warning><bold>Withdraw <amount>"
      lore:
        - "<muted>Goes to your cash."
      unavailable: "<error>Not enough in the bank"
    withdraw-all: "<warning><bold>Withdraw all <muted>(<amount>)"

admin:
  help:
    - "<prefix><primary><bold>PindaFramework</bold> <muted>v<version>"
    - " <primary>/pinda reload</primary> <muted>» <text>Reload configuration and language files"
    - " <primary>/pinda modules</primary> <muted>» <text>Overview of all modules"
    - " <primary>/pinda setup [player]</primary> <muted>» <text>Open the setup menu (again)"
  reloaded: "<prefix><success>Reloaded in <highlight><time>ms</highlight>."
  reload-failed: "<prefix><error>Reload failed. Check the console for details."
  modules-header: "<prefix><text>Modules <muted>(<count>)</muted>"
  modules-entry: " <muted>• <primary><module></primary> <muted>» <status>"
  modules-footer: "<muted>Turn modules on or off in config.yml (restart required)."
  setup-opened: "<prefix><text>Setup menu opened for <primary><player></primary>."
