        - "<muted>so players can open your shop."
    create:
      name: "<success><bold>Start a shop"
      lore:
        - "<text>Start your own shop and earn"
        - "<text>PindaCredits with your items."
        - ""
        - "<muted>Marketplace fee: <text><fee> per day open"
        - ""
        - "<muted>» <text>Click to create your shop"
    manage:
      name: "<primary><bold><shop>"
      lore:
        - "<text>Status: <status>"
        - ""
        - "<muted>» <text>Click to manage your shop"
  manage:
    title: "<dark_gray><shop>"
    help:
      name: "<primary><bold>How to fill your shop"
      lore:
        - "<muted>» <text>Drag an item onto a slot"
        - "<muted>» <text>Or shift-click an item in your inventory"
