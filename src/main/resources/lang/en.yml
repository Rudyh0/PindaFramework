    line-2: "<black><shop>"
    line-3: "<dark_gray><player>"
    open: "<dark_green>● Open"
    closed: "<dark_red>● Closed"
    removed: "<dark_gray>Shop closed down"
  hub:
    title: "<dark_gray>Shops"
