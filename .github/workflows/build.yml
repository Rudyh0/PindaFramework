name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v5

      - name: Java 25 installeren
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Taalbestanden controleren
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet --break-system-packages pyyaml
          python3 scripts/check_lang.py

      - name: Plugin bouwen
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log; then
            # Compileerfouten als melding tonen, zodat ze ook zonder het volledige log te lezen zijn
            grep -E "\.java:[0-9]+: (error|warning)" build.log | head -n 40 | while IFS= read -r line; do
              echo "::error::${line#*/src/main/java/}"
            done
            exit 1
          fi

      - name: Go installeren (dev-paneel)
        uses: actions/setup-go@v5
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum

      - name: Dev-paneel testen en bouwen
        working-directory: host
        run: |
          node --check web/app.js
          bash -n install.sh
          go vet ./...
          go test ./...
          VERSION="0.1.0-b${{ github.run_number }}"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.Version=$VERSION" -o ../build/host/pinda-host-linux-$arch .
          done
          cp install.sh ../build/host/install.sh

      - name: Jar bewaren als artifact
        uses: actions/upload-artifact@v4
        with:
          name: PindaFramework-build-${{ github.run_number }}
          path: build/libs/*.jar

      - name: Release maken
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | head -n 1)
          git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.txt
          gh release create "build-${{ github.run_number }}" "$JAR" build/host/pinda-host-linux-amd64 build/host/pinda-host-linux-arm64 build/host/install.sh \
            --title "PindaFramework build #${{ github.run_number }}" \
            --notes-file notes.txt \
            --target "${{ github.sha }}"
