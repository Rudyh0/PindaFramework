plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Versie in fabric.mod.json: 1.0.0+26.2 (één jar per Minecraft-versie)
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = 'pindacraft'
}

// De bestandsnaam zonder '+' (GitHub en sommige hosts maken daar een punt van): pindacraft-1.0.0-mc26.2.jar
tasks.withType(AbstractArchiveTask).configureEach {
	archiveVersion = "${project.mod_version}-mc${project.minecraft_version}"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def props = [version: project.version, minecraft_version: project.minecraft_version]
	inputs.properties props

	filesMatching('fabric.mod.json') {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
